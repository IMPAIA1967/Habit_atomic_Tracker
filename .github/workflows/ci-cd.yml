name: CI/CD Pipeline

on:
  push:
    branches: [ homework ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=*/migrations/*

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///test_db.sqlite3
        run: |
          python manage.py test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: habit_tracker:latest

      - name: Test Docker Compose config
        run: |
          docker compose config

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/homework'
    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/habit-tracker
            cd ~/habit-tracker
            git init
            git remote add origin https://github.com/${{ github.repository }}.git
            git fetch origin homework
            git reset --hard origin/homework
            docker compose down --remove-orphans || true
            docker compose up --build -d
            docker compose ps